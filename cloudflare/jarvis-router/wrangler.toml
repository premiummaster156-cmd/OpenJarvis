name = "jarvis-ai-router"
main = "src/index.js"
compatibility_date = "2026-11-15"
workers_dev = true

[vars]
# Replace "*" with your exact Cloudflare Pages origin for production.
JARVIS_ALLOWED_ORIGINS = "*"
JARVIS_MODELS = "[]"
OLLAMA_CLOUD_MODEL_MAP = "{}"
JARVIS_FALLBACK_ORDER = "[]"
MAX_UPSTREAM_ATTEMPTS = "4"
UPSTREAM_TIMEOUT_MS = "60000"

[observability]
enabled = true
head_sampling_rate = 1
